    <link rel="manifest" href="/manifest.json" />
    <style>
      /*
        Global reduced-motion guard (§20).

        <MotionConfig reducedMotion="user"> in App.tsx governs framer-motion, but
        it cannot reach CSS @keyframes — and 16 `infinite` CSS animations across
        the app ran regardless of the preference. This catches every one of them,
        including anything added later that forgets to ask, and it applies before
        React mounts so the splash screen is covered too.

        Durations are near-zero rather than `none` so animation end events still
        fire and nothing waits forever on a callback that never arrives.
      */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
