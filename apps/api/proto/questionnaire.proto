syntax = "proto3";

package neurodyne.v1;

option go_package = "github.com/neurodynecorp/api/internal/adapter/driving/grpc/pb";

service QuestionnaireService {
  rpc GetQuestions(GetQuestionsRequest) returns (GetQuestionsResponse);
  rpc GetAdaptiveQuestions(GetAdaptiveQuestionsRequest) returns (GetQuestionsResponse);
  rpc SaveResponse(SaveResponseRequest) returns (QuestionnaireResponseProto);
  rpc CompleteQuestionnaire(CompleteQuestionnaireRequest) returns (QuestionnaireResponseProto);
}

message GetQuestionsRequest {
  string category = 1;
}

message GetAdaptiveQuestionsRequest {
  repeated AnswerInput current_answers = 1;
}

message AnswerInput {
  string question_id = 1;
  string value = 2;
  repeated string values = 3;
}

message SaveResponseRequest {
  string project_id = 1;
  string client_id = 2;
  repeated AnswerInput answers = 3;
}

message CompleteQuestionnaireRequest {
  string project_id = 1;
}

message GetQuestionsResponse {
  repeated QuestionProto questions = 1;
}

message QuestionProto {
  string id = 1;
  string text = 2;
  string type = 3;
  repeated string options = 4;
  bool required = 5;
  int32 order = 6;
  string category = 7;
  string help_text = 8;
  DependencyProto depends_on = 9;
}

message DependencyProto {
  string question_id = 1;
  string answer = 2;
}

message QuestionnaireResponseProto {
  string id = 1;
  string project_id = 2;
  string client_id = 3;
  repeated AnswerProto answers = 4;
  bool completed = 5;
  string created_at = 6;
  string updated_at = 7;
}

message AnswerProto {
  string question_id = 1;
  string value = 2;
  repeated string values = 3;
}
