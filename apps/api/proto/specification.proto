syntax = "proto3";

package neurodyne.v1;

option go_package = "github.com/neurodynecorp/api/internal/adapter/driving/grpc/pb";

service SpecificationService {
  rpc GenerateSpec(GenerateSpecRequest) returns (SpecificationResponse);
  rpc GetSpec(GetSpecRequest) returns (SpecificationResponse);
  rpc GetSpecByProject(GetSpecByProjectRequest) returns (SpecificationResponse);
  rpc UpdateSpec(UpdateSpecRequest) returns (SpecificationResponse);
  rpc ApproveSpec(ApproveSpecRequest) returns (SpecificationResponse);
  rpc RejectSpec(RejectSpecRequest) returns (SpecificationResponse);
  rpc AddInternalNote(AddInternalNoteRequest) returns (SpecificationResponse);
}

message GenerateSpecRequest {
  string project_id = 1;
}

message GetSpecRequest {
  string id = 1;
}

message GetSpecByProjectRequest {
  string project_id = 1;
}

message UpdateSpecRequest {
  string id = 1;
  string overview = 2;
  repeated string objectives = 3;
  repeated FeatureSpecInput feature_breakdown = 4;
}

message FeatureSpecInput {
  string name = 1;
  string description = 2;
  repeated string sub_features = 3;
  string priority = 4;
  double estimated_hours = 5;
}

message ApproveSpecRequest {
  string spec_id = 1;
  string approver_id = 2;
}

message RejectSpecRequest {
  string spec_id = 1;
}

message AddInternalNoteRequest {
  string spec_id = 1;
  string author_id = 2;
  string content = 3;
}

message SpecificationResponse {
  string id = 1;
  string project_id = 2;
  int32 version = 3;
  string status = 4;
  string overview = 5;
  repeated string objectives = 6;
  repeated FeatureSpecResponse feature_breakdown = 7;
  TimelineEstimateResponse timeline_estimate = 8;
  CostEstimateResponse cost_estimate = 9;
  repeated string assumptions = 10;
  repeated RiskResponse risks = 11;
  string created_at = 12;
  string updated_at = 13;
}

message FeatureSpecResponse {
  string name = 1;
  string description = 2;
  repeated string sub_features = 3;
  string priority = 4;
  double estimated_hours = 5;
}

message TimelineEstimateResponse {
  int32 total_weeks = 1;
  repeated PhaseEstimateResponse phases = 2;
}

message PhaseEstimateResponse {
  string name = 1;
  int32 weeks = 2;
  string details = 3;
}

message CostEstimateResponse {
  double total_min = 1;
  double total_max = 2;
  string currency = 3;
}

message RiskResponse {
  string description = 1;
  string impact = 2;
  string mitigation = 3;
}
