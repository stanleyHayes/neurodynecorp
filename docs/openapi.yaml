openapi: 3.0.3
info:
  title: NeuroDyne Corp API
  description: |
    REST API for the NeuroDyne Corp project management platform.
    Handles authentication, projects, specifications, tasks, invoices,
    messaging, notifications, file uploads, questionnaires, and contact forms.
  version: 1.0.0
  contact:
    name: NeuroDyne Corp
    email: noreply@neurodynecorp.com

servers:
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication & profile
  - name: Users
    description: User management (admin only)
  - name: Projects
    description: Project CRUD & lifecycle
  - name: Specifications
    description: Project specification generation & approval
  - name: Tasks
    description: Task & sprint management
  - name: Invoices
    description: Billing & invoices
  - name: Messages
    description: Threads & messaging
  - name: Notifications
    description: User notifications
  - name: Files
    description: File uploads (Cloudinary)
  - name: Questionnaire
    description: Adaptive project questionnaire
  - name: Contact
    description: Public contact form

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, project_manager, developer, qa, client]
        phone:
          type: string
        company:
          type: string
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        clientId:
          type: string
        status:
          type: string
          enum: [lead, under_review, approved, in_development, qa, delivered]
        type:
          type: string
        features:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              priority:
                type: string
        userRoles:
          type: array
          items:
            type: string
        integrations:
          type: array
          items:
            type: string
        budgetRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            currency:
              type: string
        timeline:
          type: object
          properties:
            startDate:
              type: string
              format: date-time
            endDate:
              type: string
              format: date-time
            estimatedWeeks:
              type: integer
        assignedTeam:
          type: array
          items:
            type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        milestones:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        sprintId:
          type: string
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: string
        reporterId:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done, cancelled]
        labels:
          type: array
          items:
            type: string
        storyPoints:
          type: number
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Sprint:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [planning, active, completed]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        clientId:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
              total:
                type: number
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Specification:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [draft, pending_review, approved, rejected]
        version:
          type: integer
        overview:
          type: string
        objectives:
          type: array
          items:
            type: string
        featureBreakdown:
          type: array
          items:
            type: object
        technicalArchitecture:
          type: object
        timelineEstimate:
          type: object
        costEstimate:
          type: object
        createdAt:
          type: string
          format: date-time

    Thread:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        participantIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        senderId:
          type: string
        content:
          type: string
        attachments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UploadedFile:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileURL:
          type: string
        publicId:
          type: string
        fileSize:
          type: number
        mimeType:
          type: string
        uploadedBy:
          type: string
        projectId:
          type: string
        createdAt:
          type: string
          format: date-time

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [admin, project_manager, developer, qa, client]
                phone:
                  type: string
                company:
                  type: string
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/AuthTokens"
        "409":
          description: User already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials or inactive user

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired refresh token

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # ── Users ─────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: List all users (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, project_manager, developer, qa, client]
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      tags: [Users]
      summary: Update user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [admin, project_manager, developer, qa, client]
                phone:
                  type: string
                company:
                  type: string
                isActive:
                  type: boolean
      responses:
        "200":
          description: User updated
        "404":
          description: User not found
    delete:
      tags: [Users]
      summary: Deactivate user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deactivated

  # ── Projects ──────────────────────────────────────────────────────────────

  /projects:
    post:
      tags: [Projects]
      summary: Create a new project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, type]
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                features:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      priority:
                        type: string
                      complexity:
                        type: string
                userRoles:
                  type: array
                  items:
                    type: string
                integrations:
                  type: array
                  items:
                    type: string
                budgetRange:
                  type: object
                  properties:
                    min:
                      type: number
                    max:
                      type: number
                    currency:
                      type: string
                timeline:
                  type: object
                  properties:
                    expectedStart:
                      type: string
                      format: date-time
                    expectedEnd:
                      type: string
                      format: date-time
                    durationWeeks:
                      type: integer
                    preferredUrgency:
                      type: string
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    get:
      tags: [Projects]
      summary: List projects (clients see only their own)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [lead, under_review, approved, in_development, qa, delivered]
        - name: type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated project list

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found

  /projects/{id}/status:
    patch:
      tags: [Projects]
      summary: Update project status (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [lead, under_review, approved, in_development, qa, delivered]
      responses:
        "200":
          description: Status updated
        "422":
          description: Invalid status transition

  /projects/{id}/team:
    put:
      tags: [Projects]
      summary: Assign team members (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamMemberIds]
              properties:
                teamMemberIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Team assigned

  /projects/{id}/progress:
    patch:
      tags: [Projects]
      summary: Update project progress (admin/PM/dev only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progress]
              properties:
                progress:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Progress updated

  # ── Specifications ────────────────────────────────────────────────────────

  /specifications:
    post:
      tags: [Specifications]
      summary: Generate specification for a project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
      responses:
        "201":
          description: Specification generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
        "422":
          description: Questionnaire incomplete
    get:
      tags: [Specifications]
      summary: Get specification by project ID
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"
        "404":
          description: Specification not found

  /specifications/{id}:
    get:
      tags: [Specifications]
      summary: Get specification by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Specification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specification"

  /specifications/{id}/approve:
    post:
      tags: [Specifications]
      summary: Approve specification (admin/PM/client)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Specification approved

  /specifications/{id}/reject:
    post:
      tags: [Specifications]
      summary: Reject specification (admin/PM/client)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Specification rejected

  /specifications/{id}/notes:
    post:
      tags: [Specifications]
      summary: Add internal note to specification
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Note added

  /specifications/{id}/pdf:
    get:
      tags: [Specifications]
      summary: Download specification as PDF
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ── Tasks ─────────────────────────────────────────────────────────────────

  /tasks:
    post:
      tags: [Tasks]
      summary: Create a task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, title]
              properties:
                projectId:
                  type: string
                sprintId:
                  type: string
                title:
                  type: string
                description:
                  type: string
                assigneeId:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                labels:
                  type: array
                  items:
                    type: string
                storyPoints:
                  type: number
                dueDate:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    get:
      tags: [Tasks]
      summary: List tasks with filters
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: sprintId
          in: query
          schema:
            type: string
        - name: assigneeId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [backlog, todo, in_progress, in_review, done, cancelled]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      tags: [Tasks]
      summary: Update task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                assigneeId:
                  type: string
                  nullable: true
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                status:
                  type: string
                  enum: [backlog, todo, in_progress, in_review, done, cancelled]
                labels:
                  type: array
                  items:
                    type: string
                storyPoints:
                  type: number
                  nullable: true
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
                sprintId:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Task updated
    delete:
      tags: [Tasks]
      summary: Delete task (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Task deleted

  /tasks/sprints:
    post:
      tags: [Tasks]
      summary: Create a sprint (admin/PM only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, name, startDate, endDate]
              properties:
                projectId:
                  type: string
                name:
                  type: string
                goal:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Sprint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
    get:
      tags: [Tasks]
      summary: List sprints for a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sprint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sprint"

  /tasks/sprints/{id}:
    get:
      tags: [Tasks]
      summary: Get sprint by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sprint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
    patch:
      tags: [Tasks]
      summary: Update sprint (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                goal:
                  type: string
                status:
                  type: string
                  enum: [planning, active, completed]
      responses:
        "200":
          description: Sprint updated
    delete:
      tags: [Tasks]
      summary: Delete sprint (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Sprint deleted

  # ── Invoices ──────────────────────────────────────────────────────────────

  /invoices:
    post:
      tags: [Invoices]
      summary: Create invoice (admin/PM only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, clientId, items, dueDate]
              properties:
                projectId:
                  type: string
                clientId:
                  type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [description, quantity, unitPrice, total]
                    properties:
                      description:
                        type: string
                      quantity:
                        type: number
                      unitPrice:
                        type: number
                      total:
                        type: number
                tax:
                  type: number
                  default: 0
                currency:
                  type: string
                  default: USD
                dueDate:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    get:
      tags: [Invoices]
      summary: List invoices (clients see own; admin/PM can filter by clientId)
      security:
        - BearerAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Invoice list

  /invoices/{id}/paid:
    post:
      tags: [Invoices]
      summary: Mark invoice as paid (admin/PM only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId]
              properties:
                paymentId:
                  type: string
      responses:
        "200":
          description: Invoice marked as paid
        "409":
          description: Invoice already paid

  # ── Messages ──────────────────────────────────────────────────────────────

  /messages/threads:
    post:
      tags: [Messages]
      summary: Create a thread
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, title, participantIds]
              properties:
                projectId:
                  type: string
                title:
                  type: string
                participantIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
    get:
      tags: [Messages]
      summary: List threads (by project or by participant)
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/Thread"

  /messages/threads/{threadId}:
    get:
      tags: [Messages]
      summary: Get thread by ID
      security:
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        "404":
          description: Thread not found

  /messages/threads/{threadId}/messages:
    post:
      tags: [Messages]
      summary: Send a message in a thread
      security:
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                attachments:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    get:
      tags: [Messages]
      summary: Get messages in a thread
      security:
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"

  # ── Notifications ─────────────────────────────────────────────────────────

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for current user
      security:
        - BearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Marked as read

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - BearerAuth: []
      responses:
        "204":
          description: All marked as read

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete a notification
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification deleted

  # ── Files ─────────────────────────────────────────────────────────────────

  /files/upload:
    post:
      tags: [Files]
      summary: Upload a file (max 10MB)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"

  /files:
    get:
      tags: [Files]
      summary: List files by project
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File list

  /files/{id}:
    get:
      tags: [Files]
      summary: Get file metadata
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
    delete:
      tags: [Files]
      summary: Delete a file
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: File deleted

  # ── Questionnaire ─────────────────────────────────────────────────────────

  /questionnaire/questions:
    get:
      tags: [Questionnaire]
      summary: Get all questionnaire questions (public)
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Question list

  /questionnaire/adaptive:
    post:
      tags: [Questionnaire]
      summary: Get adaptive follow-up questions (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, value]
                    properties:
                      questionId:
                        type: string
                      value: {}
      responses:
        "200":
          description: Adaptive questions

  /questionnaire/responses:
    post:
      tags: [Questionnaire]
      summary: Save questionnaire responses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, answers]
              properties:
                projectId:
                  type: string
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId, value]
                    properties:
                      questionId:
                        type: string
                      value: {}
      responses:
        "201":
          description: Responses saved

  /questionnaire/complete:
    post:
      tags: [Questionnaire]
      summary: Mark questionnaire as complete
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
      responses:
        "200":
          description: Questionnaire marked as complete

  # ── Contact ───────────────────────────────────────────────────────────────

  /contact:
    post:
      tags: [Contact]
      summary: Submit contact form (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                company:
                  type: string
                phone:
                  type: string
                subject:
                  type: string
                message:
                  type: string
                  minLength: 10
                projectType:
                  type: string
                  enum: [web_app, mobile_app, ai_system, blockchain]
      responses:
        "201":
          description: Contact form submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
