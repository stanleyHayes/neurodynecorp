name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/client/**"
      - "apps/admin/**"
      - "packages/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/client/**"
      - "apps/admin/**"
      - "packages/**"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: |
          pnpm --filter @neurodyne/web build
          pnpm --filter @neurodyne/admin build
          pnpm --filter @neurodyne/client build
