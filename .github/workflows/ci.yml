name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (All)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NEURODYNE_MONGODB_URI: mongodb://localhost:27017
      NEURODYNE_MONGODB_DATABASE: neurodynecorp_test
      NEURODYNE_REDIS_HOST: localhost
      NEURODYNE_REDIS_PORT: 6379
      NEURODYNE_JWT_ACCESS_SECRET: test-secret-for-ci
      NEURODYNE_JWT_REFRESH_SECRET: test-refresh-secret-for-ci
      NEURODYNE_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neurodyne/server test

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      MONGODB_URI: mongodb://localhost:27017
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run Go tests
        run: cd apps/api && go test -v -race ./...

  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-server, test-api]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @neurodyne/shared build

      - name: Build frontends
        run: |
          pnpm --filter @neurodyne/web build
          pnpm --filter @neurodyne/admin build
          pnpm --filter @neurodyne/client build

      - name: Build server
        run: pnpm --filter @neurodyne/server build

      - name: Build API
        run: cd apps/api && go build -o bin/server cmd/server/main.go
