name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - ".github/workflows/server.yml"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @neurodyne/server typecheck

      - name: Lint
        run: pnpm --filter @neurodyne/server lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NEURODYNE_MONGODB_URI: mongodb://localhost:27017
      NEURODYNE_MONGODB_DATABASE: neurodynecorp_test
      NEURODYNE_REDIS_HOST: localhost
      NEURODYNE_REDIS_PORT: 6379
      NEURODYNE_JWT_ACCESS_SECRET: test-secret-for-ci
      NEURODYNE_JWT_REFRESH_SECRET: test-refresh-secret-for-ci
      NEURODYNE_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @neurodyne/server test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @neurodyne/server build
