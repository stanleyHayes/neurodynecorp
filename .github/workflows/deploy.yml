name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @neurodyne/server test

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t neurodyne-server:latest .


      - name: Save images
        run: |
          docker save neurodyne-server:latest -o neurodyne-server.tar

      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: neurodyne-server-image
          path: neurodyne-server.tar


  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook (Server)
        run: |
          if [ -n "${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}"
          fi


      - name: Trigger Render deploy hook (Web)
        run: |
          if [ -n "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}"
          fi
