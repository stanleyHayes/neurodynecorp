name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @neurodyne/mobile lint

      - name: Typecheck
        run: pnpm --filter @neurodyne/mobile typecheck
