# NeuroDyne Corp — Render.com Blueprint
# Deploy with: render blueprint apply -f render.yaml
# Or import into Render Dashboard.

services:
  - type: web
    name: neurodyne-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEURODYNE_HOST
        value: 0.0.0.0
      - key: NEURODYNE_PORT
        value: 4000
      - key: NEURODYNE_MONGODB_URI
        fromDatabase:
          name: neurodyne-mongodb
          property: connectionString
      - key: NEURODYNE_REDIS_URL
        fromService:
          type: redis
          name: neurodyne-redis
          property: connectionString
      - key: NEURODYNE_JWT_ACCESS_SECRET
        generateValue: true
      - key: NEURODYNE_JWT_REFRESH_SECRET
        generateValue: true
      - key: NEURODYNE_CORS_ORIGINS
        value: "https://neurodynecorp.com,https://admin.neurodynecorp.com,https://client.neurodynecorp.com"
    healthCheckPath: /health
    numInstances: 1

  - type: web
    name: neurodyne-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    plan: standard
    envVars:
      - key: SERVER_ENVIRONMENT
        value: production
      - key: SERVER_HTTP_PORT
        value: 8080
      - key: SERVER_GRPC_PORT
        value: 50051
      - key: MONGODB_URI
        fromDatabase:
          name: neurodyne-mongodb
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: redis
          name: neurodyne-redis
          property: hostport
      - key: JWT_SECRET
        fromService:
          type: web
          name: neurodyne-server
          envVarKey: NEURODYNE_JWT_ACCESS_SECRET
    healthCheckPath: /health
    numInstances: 1

  - type: web
    name: neurodyne-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @neurodyne/web build
    staticPublishPath: ./apps/web/dist
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: neurodyne-client
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @neurodyne/client build
    staticPublishPath: ./apps/client/dist
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: neurodyne-admin
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @neurodyne/admin build
    staticPublishPath: ./apps/admin/dist
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    envVars:
      - key: NODE_VERSION
        value: 20

databases:
  - name: neurodyne-mongodb
    databaseName: neurodyne
    plan: standard
    ipAllowList: []

  - name: neurodyne-redis
    plan: standard
    ipAllowList: []
