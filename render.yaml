# NeuroDyne Corp — Render.com Blueprint
# Deploy with: render blueprint apply -f render.yaml
# Or import into Render Dashboard.

services:
  - type: web
    name: neurodyne-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    plan: free
    domains:
      - api.neurodyne.dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEURODYNE_HOST
        value: 0.0.0.0
      - key: NEURODYNE_PORT
        value: 4000
      - key: NEURODYNE_MONGODB_URI
        sync: false
      - key: NEURODYNE_MONGODB_DATABASE
        value: neurodyne
      - key: NEURODYNE_REDIS_URL
        fromService:
          type: keyvalue
          name: neurodyne-redis
          property: connectionString
      - key: NEURODYNE_JWT_ACCESS_SECRET
        generateValue: true
      - key: NEURODYNE_JWT_REFRESH_SECRET
        generateValue: true
      - key: NEURODYNE_CORS_ORIGINS
        value: "https://neurodyne.dev,https://admin.neurodyne.dev,https://client.neurodyne.dev,https://admin-neurodynecorp.vercel.app,https://client-neurodyncorp.vercel.app"
      - key: NEURODYNE_SITE_URL
        value: https://neurodyne.dev
      - key: NEURODYNE_PROJECT_INTAKE_NOTIFY_TO
        sync: false
      - key: NEURODYNE_RESEND_API_KEY
        sync: false
      - key: NEURODYNE_EMAIL_FROM
        sync: false
      - key: NEURODYNE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEURODYNE_CLOUDINARY_API_KEY
        sync: false
      - key: NEURODYNE_CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INTAKE_MODEL
        value: gpt-5-mini
    healthCheckPath: /health
    numInstances: 1

  # Render Key Value is Redis/Valkey-compatible and belongs in services,
  # not databases (which is reserved for managed Postgres instances).
  - name: neurodyne-redis
    type: keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
