# NeuroDyne Corp — Render.com Blueprint
# Deploy with: render blueprint apply -f render.yaml
# Or import into Render Dashboard.

services:
  - type: web
    name: neurodyne-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    repo: https://github.com/neurodynecorp/neurodynelabs
    branch: main
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEURODYNE_HOST
        value: 0.0.0.0
      - key: NEURODYNE_PORT
        value: 4000
      - key: NEURODYNE_MONGODB_URI
        sync: false
      - key: NEURODYNE_REDIS_URL
        fromService:
          type: redis
          name: neurodyne-redis
          property: connectionString
      - key: NEURODYNE_JWT_ACCESS_SECRET
        generateValue: true
      - key: NEURODYNE_JWT_REFRESH_SECRET
        generateValue: true
      - key: NEURODYNE_CORS_ORIGINS
        value: "https://neurodynecorp.com,https://admin.neurodynecorp.com,https://client.neurodynecorp.com,https://admin-neurodynecorp.vercel.app,https://client-neurodyncorp.vercel.app"
    healthCheckPath: /health
    numInstances: 1


databases:
  - name: neurodyne-redis
    plan: standard
    ipAllowList: []
