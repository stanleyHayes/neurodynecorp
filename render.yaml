# NeuroDyne Corp — Render.com Blueprint
# Deploy with: render blueprint apply -f render.yaml
# Or import into Render Dashboard.

services:
  - type: web
    name: neurodyne-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    plan: free
    domains:
      - api.neurodyne.dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEURODYNE_HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NEURODYNE_MONGODB_URI
        sync: false
      - key: NEURODYNE_MONGODB_DATABASE
        value: neurodyne
      - key: NEURODYNE_REDIS_URL
        fromService:
          type: keyvalue
          name: neurodyne-redis
          property: connectionString
      - key: NEURODYNE_JWT_ACCESS_SECRET
        generateValue: true
      - key: NEURODYNE_JWT_REFRESH_SECRET
        generateValue: true
      - key: NEURODYNE_CORS_ORIGINS
        value: "https://neurodyne.dev,https://admin.neurodyne.dev,https://client.neurodyne.dev,https://admin-neurodynecorp.vercel.app,https://client-neurodyncorp.vercel.app"
      - key: NEURODYNE_SITE_URL
        value: https://neurodyne.dev
      - key: NEURODYNE_PROJECT_INTAKE_NOTIFY_TO
        sync: false
      - key: NEURODYNE_RESEND_API_KEY
        sync: false
      - key: NEURODYNE_EMAIL_FROM
        sync: false
      - key: NEURODYNE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEURODYNE_CLOUDINARY_API_KEY
        sync: false
      - key: NEURODYNE_CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_INTAKE_MODEL
        value: gpt-5-mini
    healthCheckPath: /health
    numInstances: 1

  # ── Blog scout ──────────────────────────────────────────────────────────
  # Drafts and publishes posts from public feeds. Twice a week, one post per
  # run, so the blog fills at a pace a reader can follow rather than arriving
  # in bursts.
  #
  # Reuses the server image: the Dockerfile copies the whole of apps/server, so
  # scripts/blog-scout.ts and tsx are already inside it — nothing extra to
  # build. `dockerCommand` calls node directly for the same reason the web
  # service does: pnpm 11 verifies the workspace before `exec` and can trigger
  # a full reinstall, which a small instance will not survive.
  #
  # 07:00 UTC is 07:00 in Accra. Monday and Thursday.
  - type: cron
    name: neurodyne-blog-scout
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    plan: starter
    schedule: "0 7 * * 1,4"
    dockerCommand: node --import tsx scripts/blog-scout.ts --limit 1
    envVars:
      - key: NODE_ENV
        value: production
      # Same database as the web service. Render has no cross-service reference
      # for a plain value, so this is set once in the dashboard for this service
      # too — it must match neurodyne-server exactly.
      - key: NEURODYNE_MONGODB_URI
        sync: false
      - key: NEURODYNE_MONGODB_DATABASE
        value: neurodyne
      # Without this the job runs, writes nothing, and says why.
      - key: NEURODYNE_ANTHROPIC_API_KEY
        sync: false
      - key: NEURODYNE_BLOG_MODEL
        value: claude-sonnet-5-5
      # Posts go live unreviewed. Every one is categorised "AI Automation",
      # bylined to the AI desk rather than a person, and opens with a notice
      # saying it was machine-written. Set to "false" for a draft queue instead.
      - key: NEURODYNE_BLOG_AUTOPUBLISH
        value: "true"
      # Leave unset. Blank means the byline is "Neurodyne AI Desk" rather than
      # a person who never read the post.
      - key: NEURODYNE_BLOG_AUTHOR_EMAIL
        sync: false

  # Render Key Value is Redis/Valkey-compatible and belongs in services,
  # not databases (which is reserved for managed Postgres instances).
  - name: neurodyne-redis
    type: keyvalue
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
